steps:
  # Step 1: Clear stale secret bindings from the previous deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'update'
      - 'briteco-brief'
      - '--region=us-central1'
      - '--clear-secrets'
  # Step 2: Deploy with env vars and only GOOGLE_DOCS_CREDENTIALS as a secret
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'briteco-brief'
      - '--source=.'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      # Image generation holds several large base64 PNGs + PIL buffers in memory
      # at once; 512Mi OOM-killed the worker (SIGKILL). Bump memory/CPU and cap
      # concurrency so a single instance never juggles too many image jobs.
      # Timeout raised to 600s for long generation runs.
      - '--memory=2Gi'
      - '--cpu=2'
      - '--timeout=600'
      - '--concurrency=4'
      - '--set-env-vars=OPENAI_API_KEY=${_OPENAI_API_KEY},GOOGLE_AI_API_KEY=${_GOOGLE_AI_API_KEY},ANTHROPIC_API_KEY=${_ANTHROPIC_API_KEY},PERPLEXITY_API_KEY=${_PERPLEXITY_API_KEY},ONTRAPORT_APP_ID=${_ONTRAPORT_APP_ID},ONTRAPORT_API_KEY=${_ONTRAPORT_API_KEY},SMTP_USER=${_SMTP_USER},SMTP_PASSWORD=${_SMTP_PASSWORD},SENDGRID_API_KEY=${_SENDGRID_API_KEY},SENDGRID_FROM_EMAIL=${_SENDGRID_FROM_EMAIL},SENDGRID_FROM_NAME=${_SENDGRID_FROM_NAME},SMTP_SERVER=${_SMTP_SERVER},SMTP_PORT=${_SMTP_PORT},GOOGLE_CLIENT_ID=${_GOOGLE_CLIENT_ID},GOOGLE_CLIENT_SECRET=${_GOOGLE_CLIENT_SECRET},FLASK_SECRET_KEY=${_FLASK_SECRET_KEY},CLICKUP_API_TOKEN=${_CLICKUP_API_TOKEN},CLICKUP_LIST_ID=${_CLICKUP_LIST_ID}'
      - '--set-secrets=GOOGLE_DOCS_CREDENTIALS=google-docs-credentials:latest'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
