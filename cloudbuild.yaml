steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'briteco-brief'
      - '--source=.'
      - '--region=us-central1'
      - '--allow-unauthenticated'
      - '--set-env-vars=SENDGRID_FROM_EMAIL=${_SENDGRID_FROM_EMAIL},SENDGRID_FROM_NAME=${_SENDGRID_FROM_NAME},SMTP_SERVER=${_SMTP_SERVER},SMTP_PORT=${_SMTP_PORT}'
      - '--set-secrets=OPENAI_API_KEY=openai-api-key:latest,GOOGLE_AI_API_KEY=google-ai-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,PERPLEXITY_API_KEY=perplexity-api-key:latest,ONTRAPORT_APP_ID=ontraport-app-id:latest,ONTRAPORT_API_KEY=ontraport-api-key:latest,SMTP_USER=smtp-user:latest,SMTP_PASSWORD=smtp-password:latest,SENDGRID_API_KEY=sendgrid-api-key:latest,GOOGLE_CLIENT_ID=google-client-id:latest,GOOGLE_CLIENT_SECRET=google-client-secret:latest,FLASK_SECRET_KEY=flask-secret-key:latest,GOOGLE_DOCS_CREDENTIALS=google-docs-credentials:latest'
options:
  logging: CLOUD_LOGGING_ONLY
timeout: '1200s'
