# Vision Models Reference
# ======================
# Catalog of models used by the Agent Newsletter app.
# The 'id' field is the exact string sent to the API.
# Source of truth: brite-skills/vision_models.yaml
# Last Updated: 2026-06-05 (migrated deprecated models to active replacements)

providers:
  google:
    name: "Google (Gemini)"
    env_key: "GOOGLE_API_KEY"
    models:
      # Gemini 2.5 Series - active
      - id: "gemini-2.5-pro"
        name: "Gemini 2.5 Pro"
        tier: "frontier"
        speed: "medium"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "Deep reasoning capabilities"
        cost_per_1m_input: 0.625
        cost_per_1m_output: 5.00

      - id: "gemini-2.5-flash"
        name: "Gemini 2.5 Flash"
        tier: "standard"
        speed: "fast"
        context_window: 1000000
        vision: true
        status: "active"
        notes: "Balanced performance; replacement for Gemini 2.0 Flash / Flash-Lite"
        cost_per_1m_input: 0.30
        cost_per_1m_output: 2.50

      # Image generation (Google) - kept as fallback for image tasks
      - id: "gemini-2.5-flash-image"
        name: "Gemini 2.5 Flash Image"
        tier: "standard"
        speed: "fast"
        vision: true
        image_generation: true
        status: "active"
        notes: "Google image generation (a.k.a. Nano Banana). Fallback for image tasks."

  openai:
    name: "OpenAI"
    env_key: "OPENAI_API_KEY"
    models:
      # GPT-5.5 Series - active frontier (replaces gpt-5.2)
      - id: "gpt-5.5"
        name: "GPT-5.5"
        tier: "frontier"
        speed: "medium"
        context_window: 1050000
        max_output: 128000
        vision: true
        status: "active"
        notes: "Latest frontier model. Uses max_completion_tokens. Replaces GPT-5.2."
        cost_per_1m_input: 5.00
        cost_per_1m_output: 30.00

      # GPT-5 Mini - economy reasoning variant
      - id: "gpt-5-mini"
        name: "GPT-5 Mini"
        tier: "economy"
        speed: "fast"
        context_window: 400000
        max_output: 128000
        vision: true
        status: "active"
        notes: "Smaller, faster, cheaper GPT-5. Uses max_completion_tokens."
        cost_per_1m_input: 0.25
        cost_per_1m_output: 2.00

      # GPT-4.1 Series - active
      - id: "gpt-4.1"
        name: "GPT-4.1"
        tier: "standard"
        speed: "medium"
        context_window: 1047576
        max_output: 32768
        vision: true
        status: "active"
        notes: "1M context vision model"
        cost_per_1m_input: 2.00
        cost_per_1m_output: 8.00

      - id: "gpt-4.1-mini"
        name: "GPT-4.1 Mini"
        tier: "standard"
        speed: "fast"
        context_window: 1047576
        max_output: 32768
        vision: true
        status: "active"
        notes: "1M context efficient mid-tier model"
        cost_per_1m_input: 0.40
        cost_per_1m_output: 1.60

      - id: "gpt-4.1-nano"
        name: "GPT-4.1 Nano"
        tier: "economy"
        speed: "fastest"
        context_window: 1047576
        max_output: 32768
        vision: true
        status: "active"
        notes: "1M context ultra-fast, cost-efficient"
        cost_per_1m_input: 0.10
        cost_per_1m_output: 0.40

      # GPT-4o Series - active
      - id: "gpt-4o"
        name: "GPT-4o"
        tier: "standard"
        speed: "fast"
        context_window: 128000
        vision: true
        status: "active"
        notes: "Omni model - text, audio, image, video"
        cost_per_1m_input: 2.50
        cost_per_1m_output: 10.00

      - id: "gpt-4o-mini"
        name: "GPT-4o Mini"
        tier: "economy"
        speed: "fast"
        context_window: 128000
        vision: true
        status: "active"
        notes: "Cheap, great for focused tasks"
        cost_per_1m_input: 0.15
        cost_per_1m_output: 0.60

      # Image generation (OpenAI) - primary image model
      - id: "gpt-image-2"
        name: "GPT Image 2"
        tier: "frontier"
        image_generation: true
        status: "active"
        notes: ">95% in-image text accuracy, native transparent PNG, up to 4K. Per-image ~$0.01 (low) / ~$0.06 (medium) / ~$0.22 (high) at 1024x1024."
        cost_per_1m_input: 8.00
        cost_per_1m_output: 30.00

  anthropic:
    name: "Anthropic (Claude)"
    env_key: "ANTHROPIC_API_KEY"
    models:
      # Claude Opus 4.8 - active frontier (replaces Opus 4.5)
      - id: "claude-opus-4-8"
        name: "Claude Opus 4.8"
        tier: "frontier"
        speed: "slow"
        context_window: 1000000
        max_output: 128000
        vision: true
        status: "active"
        notes: "Most capable Claude. Replaces Opus 4.5. Cheaper than 4.5 ($5/$25 per 1M)."
        cost_per_1m_input: 5.00
        cost_per_1m_output: 25.00

      # Claude Sonnet 4.6 - active standard (replaces Sonnet 4)
      - id: "claude-sonnet-4-6"
        name: "Claude Sonnet 4.6"
        tier: "standard"
        speed: "medium"
        context_window: 200000
        max_output: 64000
        vision: true
        status: "active"
        notes: "Balanced capability and speed. Replaces Sonnet 4."
        cost_per_1m_input: 3.00
        cost_per_1m_output: 15.00

      # Claude Haiku 4.5 - active economy (replaces 3.5 Haiku)
      - id: "claude-haiku-4-5-20251001"
        name: "Claude Haiku 4.5"
        tier: "economy"
        speed: "fastest"
        context_window: 200000
        vision: true
        status: "active"
        notes: "Fast and affordable. Replaces Claude 3.5 Haiku."
        cost_per_1m_input: 1.00
        cost_per_1m_output: 5.00

# Benchmark Test Groups
# Define model groups for A/B testing (active models only)
benchmark_groups:
  economy_tier:
    description: "Cheapest active models for high-volume tasks"
    models:
      - "gpt-4o-mini"
      - "gpt-4.1-nano"
      - "claude-haiku-4-5-20251001"

  standard_tier:
    description: "Balanced cost/performance active models"
    models:
      - "gemini-2.5-flash"
      - "gpt-4o"
      - "claude-sonnet-4-6"

  frontier_tier:
    description: "Highest capability active models"
    models:
      - "gpt-5.5"
      - "claude-opus-4-8"
      - "gemini-2.5-pro"

  openai_versions:
    description: "Compare OpenAI model generations"
    models:
      - "gpt-5.5"
      - "gpt-5-mini"
      - "gpt-4.1"
      - "gpt-4o"
      - "gpt-4o-mini"

  claude_versions:
    description: "Compare Claude model tiers"
    models:
      - "claude-opus-4-8"
      - "claude-sonnet-4-6"
      - "claude-haiku-4-5-20251001"

  classification_default:
    description: "Recommended active models for document classification"
    models:
      - "gemini-2.5-flash"
      - "claude-sonnet-4-6"
      - "gpt-4o-mini"

  full_comparison:
    description: "All active models across providers"
    models:
      # Frontier
      - "gpt-5.5"
      - "claude-opus-4-8"
      - "gemini-2.5-pro"
      # Standard
      - "gpt-4o"
      - "claude-sonnet-4-6"
      - "gemini-2.5-flash"
      # Economy
      - "gpt-4o-mini"
      - "claude-haiku-4-5-20251001"

# Sources:
# - brite-skills/vision_models.yaml (source of truth)
# - Google Gemini: https://ai.google.dev/gemini-api/docs/models
# - OpenAI: https://platform.openai.com/docs/models
# - Anthropic: https://platform.claude.com/docs/en/about-claude/models/overview

# =============================================================================
# TASK ASSIGNMENTS
# =============================================================================
# Maps application tasks to specific models
# Each task has: model (primary), fallback, tier, and optional alternatives

task_assignments:
  # Research & Analysis Tasks
  research_enrichment:
    description: "GPT-5.5 analysis layer for Perplexity/Insight Builder/Source Explorer"
    model: "gpt-5.5"
    fallback: "gpt-4.1"
    tier: "frontier"
    economy_alternative: "gpt-4o-mini"
    notes: "Uses max_completion_tokens parameter"

  # Content Generation Tasks
  content_generation:
    description: "Newsletter article writing (News, Tip, Trend sections)"
    model: "gpt-4o-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "economy"
    standard_alternative: "gpt-4o"
    frontier_alternative: "gpt-5.5"
    notes: "Cost-effective for high-volume content generation"

  # Brand & Quality Checks
  brand_guidelines_check:
    description: "Check content against brand voice guidelines"
    model: "gpt-4o-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "economy"
    notes: "Fast validation, doesn't need frontier capabilities"

  # Image Analysis (for meme review, etc.)
  image_analysis:
    description: "Analyze images for content appropriateness"
    model: "gpt-4o"
    fallback: "gemini-2.5-flash"
    tier: "standard"
    economy_alternative: "gpt-4o-mini"
    notes: "Needs vision capabilities"

  # Image Generation Prompts
  image_prompt_generation:
    description: "Generate prompts for image creation"
    model: "gpt-4o-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "economy"
    notes: "Creative but cost-efficient"

  # Subject Line Generation
  subject_line_generation:
    description: "Generate email subject lines and preheaders"
    model: "gpt-4o-mini"
    fallback: "claude-haiku-4-5-20251001"
    tier: "economy"
    notes: "Short outputs, economy tier sufficient"

  # Image Generation (newsletter section images, memes)
  meme_generation:
    description: "Generate newsletter/meme images with text overlays"
    model: "gpt-image-2"
    fallback: "gemini-2.5-flash-image"
    tier: "frontier"
    notes: "GPT Image 2 primary (strong in-image text); Gemini image as fallback."
